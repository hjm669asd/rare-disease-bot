<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>罕见病智能机器人</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-shell">
    <section class="hero">
      <p class="eyebrow">Enterprise RAG Demo</p>
      <h1>罕见病智能机器人</h1>
      <p class="subtitle">基于 LangChain、FAISS、DashScope 和 FastAPI 的教学版企业级 RAG 项目。</p>
      <p class="notice">本系统仅用于健康科普和 RAG 技术教学，不能替代医生诊断或治疗建议。</p>
    </section>

    <!-- 窗口标签栏 -->
    <section class="window-tabs">
      <div id="windowTabs" class="tabs-container">
        <!-- 动态生成窗口标签 -->
      </div>
      <button id="addWindowBtn" class="add-window-btn" title="新建窗口">+</button>
    </section>

    <!-- 多窗口容器 -->
    <section class="windows-container" id="windowsContainer">
      <!-- 动态生成窗口 -->
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
